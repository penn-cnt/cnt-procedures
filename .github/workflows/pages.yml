name: Publish to GitHub Pages

# Builds the manual and publishes it to https://penn-cnt.github.io/cnt-procedures/
# on every push to main. One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for the "last updated" dates
      - uses: astral-sh/setup-uv@v5
      - name: Content check (PHI / credentials)
        run: uv run --frozen python scripts/check_content.py
      - name: Build
        run: uv run --frozen mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
